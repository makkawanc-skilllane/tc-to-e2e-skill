<!-- Evidence page for scripts/evidence-report.mjs. {{...}} and the data script are filled per run. -->
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: summary strip on top, then a TC index rail beside one evidence panel (video over a 1:1 step table). */
:root{
  --bg:#f4f6fa; --panel:#ffffff; --ink:#18213a; --muted:#5d6782; --line:#dde2ec; --accent:#2446a6; --accent-soft:#e6ebf8;
  --pass:#167a3e; --pass-bg:#e3f4ea; --fail:#c0262d; --fail-bg:#fbe6e7; --block:#a35a00; --block-bg:#fdf0dc; --nr:#59627a; --nr-bg:#eceff5;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif; --f-body:"IBM Plex Sans Thai",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1422; --panel:#171e30; --ink:#e4e8f3; --muted:#9aa4bf; --line:#2a3350; --accent:#8fa8ff; --accent-soft:#222c4a;
  --pass:#5fd08b; --pass-bg:#173326; --fail:#ff7c80; --fail-bg:#3a1a1f; --block:#f2b25c; --block-bg:#3a2a12; --nr:#a8b1c8; --nr-bg:#252c40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1422; --panel:#171e30; --ink:#e4e8f3; --muted:#9aa4bf; --line:#2a3350; --accent:#8fa8ff; --accent-soft:#222c4a;
  --pass:#5fd08b; --pass-bg:#173326; --fail:#ff7c80; --fail-bg:#3a1a1f; --block:#f2b25c; --block-bg:#3a2a12; --nr:#a8b1c8; --nr-bg:#252c40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:.8rem;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;justify-content:space-between}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 20px;color:var(--muted);font-size:.85rem}
.meta b{color:var(--ink);font-weight:500}
.tally{display:flex;flex-wrap:wrap;gap:8px}
.tally button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.tally button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tally .n{font-family:var(--f-display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.rail{max-height:300px}}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 40px);position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.rail a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:9px 12px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.rail a:hover{background:var(--accent-soft)}
.rail a[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.rail .id{font-family:var(--f-mono);font-size:.78rem;font-weight:500}
.rail .t{grid-column:2;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap;align-self:center}
.Pass,.pass{color:var(--pass);background:var(--pass-bg)} .Fail,.fail,.Error{color:var(--fail);background:var(--fail-bg)}
.Blocked,.pending{color:var(--block);background:var(--block-bg)} .NotRun,.not-run,.info{color:var(--nr);background:var(--nr-bg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:16px;min-width:0}
.tc-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tc-head .id{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.reason{border-left:3px solid var(--block);background:var(--block-bg);padding:8px 12px;border-radius:4px;font-size:.9rem}
.reason.Fail,.reason.Error{border-color:var(--fail);background:var(--fail-bg)}
.reason.Pass{border-color:var(--pass);background:var(--pass-bg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.facts div{min-width:0}
.facts p{margin:4px 0 0;white-space:pre-line;font-size:.88rem}
.src{font-size:.75rem;color:var(--muted)}
video{width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;display:block}
.marks{display:flex;flex-wrap:wrap;gap:6px}
.marks button{font:500 .8rem var(--f-mono);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer}
.marks button:hover{border-color:var(--accent)}
.novideo{padding:24px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.88rem}
th{font:600 .75rem var(--f-body);letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line)}
td{vertical-align:top;padding:10px 8px;border-bottom:1px solid var(--line)}
td.n{font-family:var(--f-mono);width:36px}
td.res{width:96px}
td.res button{margin-top:6px;font:500 .75rem var(--f-mono);border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.chk li{display:grid;grid-template-columns:18px minmax(0,1fr)}
.chk .ok{color:var(--pass)} .chk .bad{color:var(--fail)} .chk .wait{color:var(--block)}
.note{color:var(--muted);font-size:.8rem;margin-top:4px}
.thumb{width:150px;max-width:100%;border:1px solid var(--line);border-radius:4px;cursor:zoom-in;display:block}
dialog{border:0;padding:0;background:transparent;max-width:96vw}
dialog img{max-width:96vw;max-height:90vh;border-radius:6px}
dialog::backdrop{background:rgba(5,10,25,.8)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
  <header class="head">
    <div><h3>{{EYEBROW}}</h3><h1>{{HEADING}}</h1></div>
    <div class="tally" id="tally"></div>
  </header>
  <div class="meta" id="meta"></div>
  <div class="main">
    <nav class="rail" id="rail" aria-label="รายการ TC"></nav>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</div>
<dialog id="zoom"><img id="zoomImg" alt=""></dialog>
<script id="data" type="application/json">{{DATA}}</script>
<script>
const { meta, cases } = JSON.parse(document.getElementById('data').textContent)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const cls = (s) => String(s).replace(/\s/g, '')
const TH = { pass: 'ผ่าน', fail: 'ไม่ผ่าน', pending: 'Blocked', info: 'บันทึก', 'not-run': 'ไม่ได้รัน' }
const mmss = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') }
let filter = null

document.getElementById('meta').innerHTML = [['Env', meta.env], ['บัญชี', meta.account], ['เบราว์เซอร์', meta.browser], ['วันที่รัน', meta.date], ['ที่มาของ TC', meta.source]]
  .map(([k, v]) => '<div>' + k + ': <b>' + esc(v) + '</b></div>').join('')

function tally() {
  const order = ['Pass', 'Fail', 'Blocked', 'Not Run']
  const n = (s) => cases.filter((c) => c.status === s || (s === 'Fail' && c.status === 'Error')).length
  document.getElementById('tally').innerHTML = '<button type="button" aria-pressed="' + (filter === null) + '" data-f=""><span class="n">' + cases.length + '</span>ทั้งหมด</button>' +
    order.map((s) => '<button type="button" aria-pressed="' + (filter === s) + '" data-f="' + s + '"><span class="n">' + n(s) + '</span><span class="pill ' + cls(s) + '">' + s + '</span></button>').join('')
}
document.getElementById('tally').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  filter = b.dataset.f || null; tally(); rail()
})

function rail() {
  const cur = location.hash.slice(1)
  document.getElementById('rail').innerHTML = cases.filter((c) => !filter || c.status === filter || (filter === 'Fail' && c.status === 'Error'))
    .map((c) => '<a href="#' + c.id + '" aria-current="' + (c.id === cur) + '"><span class="id">' + c.id.replace(/^TC-/, '') + '</span><span class="pill ' + cls(c.status) + '" style="justify-self:end">' + esc(c.status) + '</span><span class="t">' + esc(c.title) + '</span></a>').join('')
}

function checks(s) {
  if (!s.checks || !s.checks.length) return '<div>' + esc(s.actual) + '</div>'
  return '<ul class="chk">' + s.checks.map((c) => {
    const k = c.ok === true ? ['ok', '✓'] : c.ok === 'pending' ? ['wait', '⏸'] : ['bad', '✗']
    return '<li><span class="' + k[0] + '">' + k[1] + '</span><span><b>' + esc(c.label) + '</b>: ' + esc(c.got) + '</span></li>'
  }).join('') + '</ul>'
}

function show(id) {
  const c = cases.find((x) => x.id === id) || cases[0]
  const p = document.getElementById('panel')
  const reasonCls = c.status === 'Pass' ? 'Pass' : c.status
  p.innerHTML =
    '<div class="tc-head"><span class="id">' + esc(c.id) + '</span><span class="pill ' + cls(c.status) + '">' + esc(c.status) + '</span><h2 style="flex-basis:100%">' + esc(c.title) + '</h2></div>' +
    (c.reason ? '<div class="reason ' + cls(reasonCls) + '">' + esc(c.reason) + '</div>' : '') +
    (c.notes ? '<div class="reason Pass">' + esc(c.notes) + '</div>' : '') +
    '<div class="facts"><div><h3>PRECONDITION</h3><p>' + esc(c.pre) + '</p></div><div><h3>TEST DATA (ตาม TC)</h3><p>' + esc(c.data) + '</p>' +
    (c.testData ? '<h3 style="margin-top:8px">TEST DATA ที่ใช้จริง</h3><p>' + esc(c.testData) + '</p>' : '') + '</div></div>' +
    '<div class="src">ข้อความ Step และ Expected จาก: ' + esc(c.source) + '</div>' +
    (c.video ? '<div style="display:grid;gap:8px"><video id="vid" controls preload="metadata" poster="' + esc((c.steps.find((s) => s.shot) || {}).shot || '') + '" src="' + esc(c.video) + '"></video><div class="marks">' +
      c.steps.filter((s) => s.at != null).map((s) => '<button type="button" data-t="' + s.at + '">Step ' + s.n + ' · ' + mmss(s.at) + '</button>').join('') + '</div></div>'
      : '<div class="novideo">ไม่ได้รันเคสนี้ จึงไม่มีวิดีโอ</div>') +
    '<div class="tbl"><table><thead><tr><th>#</th><th>TEST STEP</th><th>EXPECTED RESULT</th><th>ACTUAL RESULT</th><th>ผล</th><th>ภาพหน้าจอ</th></tr></thead><tbody>' +
    c.steps.map((s) => '<tr><td class="n">' + s.n + '</td><td>' + esc(s.step) + '</td><td>' + (s.expected ? esc(s.expected) : '<span class="note">TC ไม่ได้ระบุ Expected ของขั้นตอนนี้</span>') + '</td><td>' + checks(s) +
      (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '') + '</td><td class="res"><span class="pill ' + cls(s.status) + '">' + (TH[s.status] || s.status) + '</span>' +
      (s.at != null && c.video ? '<br><button type="button" data-t="' + s.at + '">▶ ' + mmss(s.at) + '</button>' : '') + '</td><td>' +
      (s.shot ? '<img class="thumb" loading="lazy" src="' + esc(s.shot) + '" alt="ภาพหน้าจอ Step ' + s.n + ' ของ ' + esc(c.id) + '">' : '') + '</td></tr>').join('') +
    '</tbody></table></div>'
}

document.getElementById('panel').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-t]')
  if (b) { const v = document.getElementById('vid'); if (v) { v.currentTime = Number(b.dataset.t); v.play().catch(() => {}); v.scrollIntoView({ block: 'nearest', behavior: 'smooth' }) } return }
  const img = e.target.closest('img.thumb')
  if (img) { document.getElementById('zoomImg').src = img.src; document.getElementById('zoom').showModal() }
})
document.getElementById('zoom').addEventListener('click', (e) => e.currentTarget.close())
function route() { const id = location.hash.slice(1); show(id); rail() }
addEventListener('hashchange', route)
tally(); route()
</script>
